aid: cagent-vascular
name: Cagent Vascular
description: 'Cagent Vascular is a privately held endovascular medical device company
  based in Wayne, Pennsylvania, that develops and commercializes Serration Remodeling
  Therapy (SRT). Its flagship product, the Serranator PTA Serration Balloon Catheter,
  embeds stainless-steel serrated strips into a semi-compliant angioplasty balloon
  to create linear, interrupted micro-fissures along the artery wall, producing controlled
  lumen expansion at lower pressures when treating peripheral artery disease (PAD)
  and chronic limb-threatening ischemia (CLTI). The Serranator is FDA 510(k) cleared
  and CE marked, and the portfolio has expanded to include Serranator SL-PRO and the
  Serranator SONIC intravascular lithotripsy (IVL) system. Cagent Vascular is a device
  manufacturer rather than a software or platform company: it publishes clinical data,
  case studies, webinars and reimbursement material on its website, but no public developer
  program, API, or machine-readable interface.'
